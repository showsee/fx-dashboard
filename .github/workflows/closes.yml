name: 終値データ更新
on:
  schedule:
    - cron: "10 */3 * * *"   # 3時間ごと
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-closes.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/closes.json
          git diff --cached --quiet || (git commit -m "終値データ更新" && git push)
